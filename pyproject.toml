[project]
name = "carwash-api"
version = "0.1.0"
description = "REST backend for a multi-branch car wash operator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "email-validator>=2.2",  # required by pydantic's EmailStr
    "tzdata>=2024.1",  # timezone database for zoneinfo on Windows
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "yandex-pgmigrate>=1.0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "black>=24.8",
    "isort>=5.13",
]

[tool.pytest.ini_options]
# Tests live next to the code as <module>_test.py; tests/ holds conftest + e2e.
python_files = ["*_test.py", "test_*.py"]
testpaths = ["app", "tests"]
addopts = "-q"

# Formatting: black (code) + isort (imports). Ruff only lints.
[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app", "database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# No "I": isort owns import order. No "E501": black owns line length.
select = ["E", "F", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends() and Query() defaults are the normal FastAPI style.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
